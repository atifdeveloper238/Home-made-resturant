<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turant Alarm</title>
<style>
body{font-family:sans-serif;text-align:center;padding-top:50px;background:#fffaf0}
#alertBox{
 display:none;
 position:fixed;
 top:20px; left:50%; transform:translateX(-50%);
 width:90%; max-width:400px;
 background:red; color:white;
 padding:25px; border-radius:15px;
 font-size:24px; font-weight:bold;
 z-index:9999;
 animation: flash 0.5s infinite;
 box-shadow:0 0 30px red;
}
@keyframes flash{0%{background:red}50%{background:orange}100%{background:red}}
button{padding:15px 25px;font-size:18px;background:orange;border:none;border-radius:10px;margin-top:20px}
</style>
</head>
<body>
<h2>Turant Order Alarm Active</h2>
<p>Keep this tab open. New order = LOUD RING</p>
<div id="alertBox">NEW ORDER RECEIVED!!!</div>
<button id="startBtn" onclick="startAlarm()">Click to Activate Sound</button>
<p id="status"></p>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
const supabase = createClient('https://kahmpvgqzxarsegnrogr.supabase.co','sb_publishable_rlRMyly8iVoOlqn9MMRVow_jgjVaWtx')

let audioContext;
let alarmInterval;

function playLoudBeep(){
  if(!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
  const osc = audioContext.createOscillator();
  const gain = audioContext.createGain();
  osc.type = 'square';
  osc.frequency.value = 1000;
  gain.gain.value = 1;
  osc.connect(gain);
  gain.connect(audioContext.destination);
  osc.start();
  setTimeout(()=>osc.stop(), 300);
}

window.startAlarm = async () => {
  audioContext = new (window.AudioContext || window.webkitAudioContext)();
  await audioContext.resume();
  document.getElementById('startBtn').style.display='none';
  document.getElementById('status').innerText = 'Alarm is ACTIVE - Listening...';
  // test ring once
  playLoudBeep();
  listenOrders();
}

function ring() {
  document.getElementById('alertBox').style.display='block';
  // Ring continuously for 20 seconds
  let count = 0;
  alarmInterval = setInterval(()=>{
    playLoudBeep();
    count++;
    if(count>40){ clearInterval(alarmInterval); }
    if(navigator.vibrate) navigator.vibrate([500,200,500]);
  }, 500);
  // Also try to show system notification on top
  if(Notification.permission === 'granted'){
    new Notification('NEW ORDER # Turant!',{body:'Ali Ahmad - Check Dashboard', requireInteraction:true});
  }
}

function listenOrders(){
  if(Notification.requestPermission) Notification.requestPermission();
  supabase.channel('orders')
  .on('postgres_changes', {event:'INSERT', schema:'public', table:'orders'}, payload=>{
    ring();
  }).subscribe();
}

// Stop ringing when user taps the red box
document.getElementById('alertBox').onclick = ()=>{
  document.getElementById('alertBox').style.display='none';
  clearInterval(alarmInterval);
}
</script>
</body>
</html>
